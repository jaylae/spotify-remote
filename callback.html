<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Authentication</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; text-align: center; padding: 40px 20px; margin: 0; }
    .box { background: #181818; max-width: 400px; margin: auto; padding: 30px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { color: #1DB954; font-size: 20px; margin-top: 0; }
    p { color: #b3b3b3; font-size: 14px; line-height: 1.5; }
    input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; font-size: 14px; box-sizing: border-box; text-align: center; }
    button { background: #1DB954; color: #000; border: 0; padding: 14px; width: 100%; border-radius: 40px; font-weight: bold; font-size: 15px; cursor: pointer; }
    button:active { background: #1ed760; }
    .msg { color: #1DB954; font-size: 13px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Spotify Login Success</h2>
    <p>คัดลอกรวัสด้านล่างนี้ แล้วนำกลับไปวางในหน้าตั้งค่าของอุปกรณ์รีโมตของคุณ</p>
    <input type="text" id="codeBox" readonly onclick="this.select()">
    <button onclick="copyCode()">คัดลอกรหัส</button>
    <div class="msg" id="copyMsg">คัดลอกเรียบร้อยแล้ว!</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    if (code) {
      document.getElementById('codeBox').value = code;
    } else {
      document.getElementById('codeBox').value = "ไม่พบรหัส Authentication Code";
    }

    function copyCode() {
      const copyText = document.getElementById("codeBox");
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value);
      const msg = document.getElementById("copyMsg");
      msg.style.display = "block";
      setTimeout(() => { msg.style.display = "none"; }, 2500);
    }
  </script>
</body>
</html>
