<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Login Callback</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 50px 20px; }
        .success { color: #1DB954; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .error { color: #e91429; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .code-box { background-color: #333; padding: 15px; border-radius: 8px; word-break: break-all; margin: 20px auto; max-width: 400px; font-family: monospace; font-size: 14px; user-select: all; }
        button { background-color: #1DB954; color: #000; border: none; padding: 12px 24px; font-size: 16px; border-radius: 30px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #1ed760; }
        p { color: #b3b3b3; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="statusMessage">กำลังประมวลผล...</div>
    <div id="codeContainer" style="display:none;">
        <div class="code-box" id="authCode"></div>
        <button onclick="copyCode()">คัดลอกรหัส</button>
        <p style="margin-top:20px; font-size:14px;">คัดลอกรหัสนี้แล้วนำไปวางในหน้าตั้งค่าของเครื่อง Audio Remote</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const error = urlParams.get('error');

        const statusMsg = document.getElementById('statusMessage');
        const codeContainer = document.getElementById('codeContainer');
        const authCodeDisplay = document.getElementById('authCode');

        if (error) {
            statusMsg.innerHTML = '<span class="error">การเข้าสู่ระบบล้มเหลว</span>';
            statusMsg.innerHTML += '<p>Spotify ส่งข้อผิดพลาด: ' + error + '</p>';
        } else if (code) {
            statusMsg.innerHTML = '<span class="success">Spotify Login Success!</span>';
            authCodeDisplay.textContent = code;
            codeContainer.style.display = 'block';
        } else {
            statusMsg.innerHTML = '<span class="error">ไม่พบรหัสยืนยันตัวตน</span>';
            statusMsg.innerHTML += '<p>กรุณาลองเข้าสู่ระบบใหม่อีกครั้งจากหน้าตั้งค่าของอุปกรณ์</p>';
        }

        function copyCode() {
            const range = document.createRange();
            range.selectNode(authCodeDisplay);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            try {
                document.execCommand('copy');
                alert('คัดลอกรหัสเรียบร้อยแล้ว!');
            } catch (err) {
                alert('ไม่สามารถคัดลอกได้อัตโนมัติ กรุณาเลือกคลุมรหัสและคัดลอกด้วยตนเอง');
            }
            window.getSelection().removeAllRanges();
        }
    </script>

</body>
</html>
