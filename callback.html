<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spotify Remote</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #121212;
      color: #ffffff;
    }

    main {
      box-sizing: border-box;
      width: min(92vw, 460px);
      padding: 32px 24px;
      border-radius: 18px;
      background: #1f1f1f;
      text-align: center;
      box-shadow: 0 14px 40px rgb(0 0 0 / 35%);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 1.45rem;
    }

    p {
      margin: 0;
      line-height: 1.55;
      color: #d2d2d2;
    }

    .ok {
      color: #1ed760;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">กำลังเชื่อม Spotify…</h1>
    <p id="message">โปรดรอสักครู่ อย่าปิดหน้านี้</p>
  </main>

  <script>
    const API_BASE = "https://spotify-remote-api.wolrajt.workers.dev";

    const title = document.getElementById("title");
    const message = document.getElementById("message");

    function showError(text) {
      title.textContent = "เชื่อม Spotify ไม่สำเร็จ";
      title.className = "error";
      message.textContent = text;
    }

    function showSuccess() {
      title.textContent = "เชื่อม Spotify สำเร็จ";
      title.className = "ok";
      message.textContent =
        "กลับไปที่ Spotify Remote ได้เลย อุปกรณ์จะตรวจพบการเชื่อมต่อเอง";
    }

    async function completeSpotifyLogin() {
      const params = new URLSearchParams(window.location.search);
      const spotifyError = params.get("error");
      const code = params.get("code");
      const state = params.get("state");

      if (spotifyError) {
        showError("Spotify ยกเลิกหรือปฏิเสธการอนุญาต: " + spotifyError);
        return;
      }

      if (!code || !state) {
        showError(
          "ไม่พบข้อมูลการเชื่อมบัญชี กลับไปที่อุปกรณ์แล้วเริ่ม Connect Spotify ใหม่"
        );
        return;
      }

      try {
        const response = await fetch(API_BASE + "/v1/spotify/complete", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ code, state })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          showError(
            result.error ||
            "ไม่สามารถบันทึกการเชื่อม Spotify ได้ กลับไปที่อุปกรณ์แล้วลองใหม่"
          );
          return;
        }

        /* ลบรหัสใช้ครั้งเดียวออกจากแถบที่อยู่ของเบราว์เซอร์ */
        window.history.replaceState({}, document.title, window.location.pathname);
        showSuccess();
      } catch (error) {
        showError(
          "ติดต่อบริการเชื่อม Spotify ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่"
        );
      }
    }

    completeSpotifyLogin();
  </script>
</body>
</html>
